name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-typecheck:
        name: Lint & Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm --filter backend db:generate

            - name: Type Check
              run: pnpm type-check

            - name: Lint
              run: pnpm lint
              continue-on-error: true

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm --filter backend db:generate

            - name: Test
              run: pnpm test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint-and-typecheck, test]
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm --filter backend db:generate

            - name: Build
              run: pnpm build
